exec --no-startup-id ~/.config/i3/scripts/compose-key-watchdog.sh
exec --no-startup-id i3-msg workspace "1:A"
exec --no-startup-id ~/dotfiles/scripts/theme-apply --restore
exec --no-startup-id ~/.config/yshell/scripts/yshell
exec --no-startup-id env CM_DIR="$HOME/.local/share" CM_SELECTIONS="clipboard" clipmenud
# dunst replaced by yshell notification server
# exec --no-startup-id dunst
exec --no-startup-id picom
exec --no-startup-id redshift
exec --no-startup-id dex -a -s /etc/xdg/autostart/:~/.config/autostart/
# fcitx5 (via dex) resets XKB on startup; re-apply compose after it is up
exec --no-startup-id sh -c 'sleep 2; setxkbmap -layout us -option compose:menu'
exec --no-startup-id /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# OBS 30+ shows the safe-mode prompt if .sentinel exists (left behind when OBS is killed on logout/shutdown)
exec --no-startup-id sh -c 'rm -rf "$HOME/.config/obs-studio/.sentinel"; exec obs --disable-shutdown-check --startreplaybuffer --minimize-to-tray'
exec --no-startup-id flameshot
