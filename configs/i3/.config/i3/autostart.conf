exec feh --bg-fill ~/.config/i3/wallpaper.png

exec --no-startup-id clipmenud
exec --no-startup-id dunst
exec --no-startup-id picom
exec --no-startup-id redshift
exec --no-startup-id dex -a -s /etc/xdg/autostart/:~/.config/autostart/
exec --no-startup-id /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec --no-startup-id obs --startreplaybuffer --minimize-to-tray

# eww bar
exec --no-startup-id eww daemon
exec --no-startup-id ~/.config/eww/scripts/listen-windows.sh
exec_always --no-startup-id eww open bar
exec_always --no-startup-id eww open bar-dp0

# eww volume monitor
exec_always --no-startup-id pkill -f volume-monitor.sh
exec_always --no-startup-id ~/.config/eww/scripts/volume-monitor.sh
