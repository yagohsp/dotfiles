# Keybinds

## Applications
bindsym $mod+Return exec $term
bindsym $mod+Shift+Return exec "kitty --class kitty-floating --name kitty-floating"

bindsym $mod+q kill
bindsym $mod+Shift+q exec --no-startup-id "xdotool getwindowfocus getwindowpid | xargs kill -9"
bindsym $mod+Control+Shift+q exec --no-startup-id "kill -9 $(ps aux --sort=-%cpu | awk 'NR==2 {print $2}')"
bindsym $mod+b exec firefox
bindsym $mod+e exec thunar "$HOME/Downloads"
bindsym $mod+r exec rofi -show drun -show-icons
bindsym $mod+p exec env CM_DIR="$HOME/.local/share" CM_LAUNCHER=rofi clipmenu
bindsym $mod+Control+p exec --no-startup-id env CM_DIR="$HOME/.local/share" $HOME/.config/i3/scripts/clipdel-rofi
bindsym $mod+Control+Shift+p exec --no-startup-id $HOME/.config/i3/scripts/clipclear
bindsym $mod+Shift+p exec gnome-calculator
bindsym $mod+u exec --no-startup-id "$HOME/.config/i3/scripts/i3-save-focused-window-rule"
bindsym Print exec flameshot gui
bindsym Shift+Print exec flameshot screen --clipboard --number 0
bindsym $mod+i exec --no-startup-id sh -c 'xcolor | tr -d "\n" | xclip -selection clipboard'

## Navigation
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+j focus mode_toggle

bindsym $mod+w floating toggle
bindsym $mod+t fullscreen toggle

## Workspaces
bindsym $mod+a workspace $ws1
bindsym $mod+s workspace $ws2
bindsym $mod+d workspace $ws3
bindsym $mod+f workspace $ws4

bindsym $mod+z workspace $ws5
bindsym $mod+x workspace $ws6
bindsym $mod+c workspace $ws7
bindsym $mod+v workspace $ws8

bindsym $mod+Shift+a move container to workspace $ws1; workspace $ws1
bindsym $mod+Shift+s move container to workspace $ws2; workspace $ws2
bindsym $mod+Shift+d move container to workspace $ws3; workspace $ws3
bindsym $mod+Shift+f move container to workspace $ws4; workspace $ws4

bindsym $mod+Shift+z move container to workspace $ws5; workspace $ws5
bindsym $mod+Shift+x move container to workspace $ws6; workspace $ws6
bindsym $mod+Shift+c move container to workspace $ws7; workspace $ws7
bindsym $mod+Shift+v move container to workspace $ws8; workspace $ws8

## System
bindsym $mod+Shift+r restart
bindsym $mod+o exec --no-startup-id "$HOME/.config/quickshell/scripts/lock.sh"
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.' -b 'Yes, exit i3' 'i3-msg exit'"

## Media
bindsym XF86AudioRaiseVolume exec "wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ && $HOME/.config/i3/scripts/show-volume-osd.sh"
bindsym XF86AudioLowerVolume exec "wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%- && $HOME/.config/i3/scripts/show-volume-osd.sh"
bindsym XF86AudioMute exec "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && $HOME/.config/i3/scripts/show-volume-osd.sh"
bindsym SHIFT+XF86AudioRaiseVolume exec --no-startup-id "$HOME/.config/i3/scripts/i3-focused-app-volume +2%"
bindsym SHIFT+XF86AudioLowerVolume exec --no-startup-id "$HOME/.config/i3/scripts/i3-focused-app-volume -2%"
bindsym $mod+m exec --no-startup-id "$HOME/.config/quickshell/scripts/toggle-volume-modal.sh"
bindsym $mod+shift+m exec --no-startup-id "$HOME/.config/i3/scripts/i3-cycle-focused-audio-sink"
